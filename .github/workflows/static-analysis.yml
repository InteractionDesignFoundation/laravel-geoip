name: Static Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - '**.php'
      - 'composer.lock'
      - 'psalm*'

permissions:
  contents: read

jobs:
  psalm:
    name: Psalm
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          coverage: none
          # Default is github.token, which setup-php writes to ~/.composer/auth.json for later steps to read.
          github-token: ''

      - name: Install composer dependencies
        run: "composer install --no-interaction --no-progress --no-scripts"

      - name: Run Psalm
        run: ./vendor/bin/psalm --find-unused-psalm-suppress --output-format=github --shepherd
