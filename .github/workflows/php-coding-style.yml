name: Code Style

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'

permissions:
  contents: read

jobs:
  fix:
    name: Auto-fix code style
    # Skip fork PRs — GITHUB_TOKEN can't push to external forks.
    # Fork contributors: run `composer rector && composer cs` locally.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Rector
        run: composer rector

      - name: PHP CS Fixer
        run: composer cs

      - name: Commit fixes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: 'style: auto-fix (rector + php-cs-fixer)'
          commit_author: 'GitHub Actions <actions@github.com>'

  check:
    name: Verify code style (forks)
    # Only run the check job on fork PRs where we can't auto-fix.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Rector (dry-run)
        run: composer rector:dry

      - name: PHP CS check
        run: composer cs:check
