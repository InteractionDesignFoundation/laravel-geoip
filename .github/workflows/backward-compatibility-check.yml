name: Backward compatibility check

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  bc_check:
    name: Backward compatibility check
    runs-on: ubuntu-latest
    steps:
      # The tool compares HEAD against the latest release tag, so it needs the full history and all tags.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.5
          coverage: none

      # Not a project dependency: installed globally (composer's global bin dir is on PATH).
      - name: Install roave/backward-compatibility-check
        run: composer global require --no-interaction --no-progress roave/backward-compatibility-check:8.27.0

      - name: BC Check
        run: roave-backward-compatibility-check --format=github-actions
